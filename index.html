<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BakeryBeats - Beat Maker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🥁 BakeryBeats</h1>
      <p class="subtitle">Interactive Beat Maker</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <button id="playBtn" class="btn btn-primary">▶ Play</button>
        <button id="stopBtn" class="btn btn-secondary">⏹ Stop</button>
        <button id="clearBtn" class="btn btn-danger">🗑 Clear</button>
      </div>

      <div class="control-group">
        <label for="bpmSlider">BPM: <span id="bpmValue">120</span></label>
        <input type="range" id="bpmSlider" min="60" max="200" value="120" class="slider">
      </div>

      <div class="control-group">
        <label for="volumeSlider">Volume: <span id="volumeValue">70</span>%</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="70" class="slider">
      </div>
    </div>

    <div class="sequencer">
      <div class="track-labels">
        <div class="track-label">Kick</div>
        <div class="track-label">Snare</div>
        <div class="track-label">Hi-Hat</div>
        <div class="track-label">Open Hat</div>
        <div class="track-label">Clap</div>
        <div class="track-label">Crash</div>
      </div>

      <div class="beat-grid" id="beatGrid">
        <!-- Grid will be generated by JavaScript -->
      </div>

      <div class="step-indicators">
        <div class="step-marker" data-step="0">1</div>
        <div class="step-marker" data-step="1">2</div>
        <div class="step-marker" data-step="2">3</div>
        <div class="step-marker" data-step="3">4</div>
        <div class="step-marker" data-step="4">5</div>
        <div class="step-marker" data-step="5">6</div>
        <div class="step-marker" data-step="6">7</div>
        <div class="step-marker" data-step="7">8</div>
        <div class="step-marker" data-step="8">9</div>
        <div class="step-marker" data-step="9">10</div>
        <div class="step-marker" data-step="10">11</div>
        <div class="step-marker" data-step="11">12</div>
        <div class="step-marker" data-step="12">13</div>
        <div class="step-marker" data-step="13">14</div>
        <div class="step-marker" data-step="14">15</div>
        <div class="step-marker" data-step="15">16</div>
      </div>
    </div>

    <div class="keyboard-hints">
      <h3>Keyboard Shortcuts</h3>
      <div class="hints-grid">
        <div><kbd>Space</kbd> - Play/Pause</div>
        <div><kbd>1-6</kbd> - Trigger sounds</div>
        <div><kbd>Q-P</kbd> - Toggle steps 1-16</div>
        <div><kbd>C</kbd> - Clear pattern</div>
      </div>
    </div>

    <footer>
      <p>Built with Web Audio API • Use keyboard or click to create beats</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
